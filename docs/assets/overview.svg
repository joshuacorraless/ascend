<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="750" viewBox="0 0 1320 750" role="img" aria-labelledby="title desc">
  <title id="title">Ascend local data and optional network services</title>
  <desc id="desc">Daily records are captured, validated and stored with Dexie in the current browser's IndexedDB. Historical snapshots and JSON backups preserve and move those records. Optional label images or routine documents and text go to server endpoints and then Google or Anthropic. Results return for human review before local saving. Browser voice recognition may also use an external service. There is no cross-device synchronization.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M 0 1 L 9 5 L 0 9" fill="none" stroke="#235b8a" stroke-width="1.5"/></marker>
    <style>
      text{font-family:Arial,Helvetica,sans-serif;fill:#17212b}
      .eyebrow{font-size:15px;font-weight:700;letter-spacing:1.7px;fill:#235b8a}
      .heading{font-size:25px;font-weight:700}
      .body{font-size:19px;fill:#64748b}
      .line{fill:none;stroke:#235b8a;stroke-width:2;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1320" height="750" fill="#fafafa"/>
  <text x="56" y="48" class="eyebrow">ASCEND / PERSONAL NUTRITION AND TRAINING</text>
  <text x="56" y="100" font-size="38" font-weight="700">Daily records, kept in your browser</text>
  <text x="56" y="137" class="body">Manual tracking is local. Optional capture services send selected inputs outside the device.</text>
  <rect x="56" y="183" width="792" height="427" rx="3" fill="#fff" stroke="#dce2e8" stroke-width="1.5"/>
  <text x="83" y="222" class="eyebrow">ON THIS DEVICE</text>
  <text x="84" y="285" class="heading">Log and review</text>
  <text x="84" y="319" class="body">Meals, water and weight</text>
  <text x="84" y="347" class="body">Supplements and sets</text>
  <text x="365" y="285" class="heading">Validate</text>
  <text x="365" y="319" class="body">Domain calculations</text>
  <text x="365" y="347" class="body">Zod contracts</text>
  <text x="635" y="285" class="heading">Store</text>
  <text x="635" y="319" class="body">Dexie / IndexedDB</text>
  <text x="635" y="347" class="body">Current browser</text>
  <path d="M 300 279 H 343" class="line"/>
  <path d="M 557 279 H 614" class="line"/>
  <line x1="84" y1="392" x2="819" y2="392" stroke="#dce2e8"/>
  <text x="84" y="436" class="heading">Historical context</text>
  <text x="84" y="470" class="body">Snapshots keep past records stable.</text>
  <text x="84" y="498" class="body">Goals have an effective date.</text>
  <text x="494" y="436" class="heading">Portable backups</text>
  <text x="494" y="470" class="body">Validated, versioned JSON</text>
  <text x="494" y="498" class="body">No cross-device synchronization</text>
  <line x1="84" y1="539" x2="819" y2="539" stroke="#dce2e8"/>
  <text x="84" y="580" font-size="20" fill="#235b8a" style="fill:#235b8a">External results return for review before local saving.</text>
  <rect x="902" y="183" width="362" height="427" rx="3" fill="#fff" stroke="#235b8a" stroke-width="1.5" stroke-dasharray="6 6"/>
  <text x="930" y="222" class="eyebrow">OPTIONAL NETWORK PATH</text>
  <text x="930" y="270" class="heading">Selected input</text>
  <text x="930" y="303" class="body">Label image, routine document</text>
  <text x="930" y="331" class="body">or routine text</text>
  <path d="M 1083 349 V 380" class="line"/>
  <text x="930" y="416" class="heading">Server endpoints</text>
  <text x="930" y="446" font-size="17" fill="#64748b" style="fill:#64748b">analyze-label · analyze-routine</text>
  <path d="M 1083 463 V 494" class="line"/>
  <text x="930" y="530" class="heading">Google / Anthropic</text>
  <text x="930" y="560" class="body">Configured external provider</text>
  <path d="M 902 580 H 861" class="line"/>
  <text x="56" y="661" font-size="22" font-weight="700">Core manual flows need no account or cloud database.</text>
  <text x="56" y="699" class="body">AI needs a connection and server-side keys. Browser voice recognition may also use a network service.</text>
  <text x="56" y="728" font-size="17" fill="#64748b" style="fill:#64748b">Back up regularly: clearing or evicting browser storage can remove the local history.</text>
</svg>
