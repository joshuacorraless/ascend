<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ascend — Sin conexión</title>
    <style>
      body {
        margin: 0;
        font-family: system-ui, -apple-system, sans-serif;
        background: #3c3c3c;
        color: #f5f5f5;
        display: grid;
        place-items: center;
        min-height: 100vh;
        text-align: center;
        padding: 24px;
      }
      .card { max-width: 380px; }
      h1 { font-size: 1.25rem; margin: 0 0 8px; }
      p { color: #b5b5b5; line-height: 1.5; }
      .dot { color: #51cf66; font-weight: 700; }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>Estás sin conexión</h1>
      <p>
        Ascend funciona <span class="dot">local-first</span>: tus registros viven en este
        dispositivo. Vuelve a abrir la app cuando recargue. Las funciones principales no necesitan
        internet.
      </p>
    </div>
  </body>
</html>
